<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230"><rect width="1200" height="230" rx="18" fill="#102c3d"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="36" y="45" fill="#a3ddbe" font-size="23" font-weight="700">還原原版</text><rect x="35" y="78" width="322" height="85" rx="12" fill="#1a3e50"/><text x="196" y="112" text-anchor="middle" fill="#f0f8fa" font-size="20">執行「還原原版.cmd」</text><text x="196" y="143" text-anchor="middle" fill="#b9d8e4" font-size="16">先關閉遊戲</text><path d="M374 120 h30 m-8 -7 l8 7 -8 7 M791 120 h30 m-8 -7 l8 7 -8 7" fill="none" stroke="#a3ddbe" stroke-width="2"/><rect x="421" y="78" width="352" height="85" rx="12" fill="#1a3e50"/><text x="597" y="112" text-anchor="middle" fill="#f0f8fa" font-size="20">輸入遊戲路徑與備份路徑</text><text x="597" y="143" text-anchor="middle" fill="#b9d8e4" font-size="16">使用這次安裝產生的備份</text><rect x="838" y="78" width="326" height="85" rx="12" fill="#1a3e50"/><text x="1001" y="112" text-anchor="middle" fill="#f0f8fa" font-size="20">校驗通過後還原</text><text x="1001" y="143" text-anchor="middle" fill="#b9d8e4" font-size="16">還原本補丁變更的 16 個檔案</text><text x="36" y="203" fill="#f1c879" font-size="17">請保留 ZH-Patch-Backup-v2.2-時間 資料夾；沒有備份就無法使用此工具還原。</text></g></svg>