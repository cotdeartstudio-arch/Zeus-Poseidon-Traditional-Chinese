<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290"><rect width="1200" height="290" rx="18" fill="#102c3d"/>
<g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="36" y="46" fill="#f5e3be" font-size="23" font-weight="700">安裝四步驟</text><text x="1160" y="44" text-anchor="end" fill="#b9d8e4" font-size="15">操作示意 · 安裝前請先關閉遊戲</text>
<rect x="30" y="75" width="255" height="178" rx="12" fill="#1a3e50" stroke="#f1c879" stroke-opacity=".55"/><circle cx="64" cy="110" r="17" fill="#f1c879"/><text x="64" y="116" text-anchor="middle" fill="#102c3d" font-size="18" font-weight="700">1</text><text x="92" y="118" fill="#f6fafb" font-size="23" font-weight="700">先備份</text><text x="51" y="172" fill="#d4e8ee" font-size="17">複製整個遊戲資料夾</text><text x="51" y="207" fill="#d4e8ee" font-size="17">另存一份玩家存檔</text><path d="M298 164 h16 m-6 -6 l6 6 -6 6" fill="none" stroke="#8ed6e6" stroke-width="2"/><rect x="325" y="75" width="255" height="178" rx="12" fill="#1a3e50" stroke="#8ed6e6" stroke-opacity=".55"/><circle cx="359" cy="110" r="17" fill="#8ed6e6"/><text x="359" y="116" text-anchor="middle" fill="#102c3d" font-size="18" font-weight="700">2</text><text x="387" y="118" fill="#f6fafb" font-size="23" font-weight="700">解壓縮</text><text x="346" y="172" fill="#d4e8ee" font-size="17">完整解壓補丁包</text><text x="346" y="207" fill="#d4e8ee" font-size="17">保留所有檔案及資料夾</text><path d="M593 164 h16 m-6 -6 l6 6 -6 6" fill="none" stroke="#8ed6e6" stroke-width="2"/><rect x="620" y="75" width="255" height="178" rx="12" fill="#1a3e50" stroke="#8ed6e6" stroke-opacity=".55"/><circle cx="654" cy="110" r="17" fill="#8ed6e6"/><text x="654" y="116" text-anchor="middle" fill="#102c3d" font-size="18" font-weight="700">3</text><text x="682" y="118" fill="#f6fafb" font-size="23" font-weight="700">檢查版本</text><text x="641" y="172" fill="#d4e8ee" font-size="17">執行「檢查相容性.cmd」</text><text x="641" y="207" fill="#d4e8ee" font-size="17">全部通過後再安裝</text><path d="M888 164 h16 m-6 -6 l6 6 -6 6" fill="none" stroke="#8ed6e6" stroke-width="2"/><rect x="915" y="75" width="255" height="178" rx="12" fill="#1a3e50" stroke="#a3ddbe" stroke-opacity=".55"/><circle cx="949" cy="110" r="17" fill="#a3ddbe"/><text x="949" y="116" text-anchor="middle" fill="#102c3d" font-size="18" font-weight="700">4</text><text x="977" y="118" fill="#f6fafb" font-size="23" font-weight="700">安裝漢化</text><text x="936" y="172" fill="#d4e8ee" font-size="17">執行「安裝漢化.cmd」</text><text x="936" y="207" fill="#d4e8ee" font-size="17">保留工具產生的備份</text></g></svg>